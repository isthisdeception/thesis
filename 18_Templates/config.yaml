# ==============================================================================
# TEMPLATE NAME: Template 8 — Configuration
# PURPOSE: Single source of truth for experiment parameters.
# WHEN USED: Before running an experiment (Phase M4).
# OWNER: Configuration Agent
# INPUTS: Hyperparameters, baseline plan, FastAI dataset-prep defaults
# OUTPUTS: config.yaml
# REQUIRED SECTIONS: Experiment ID, Dataset Version, Split Version, Model Version,
#   FastAI Settings, Image Size, Batch Size, Epochs, Optimizer, Learning Rate,
#   Loss Function, Metrics, Random Seed, Augmentations, Hardware, Git Commit,
#   Timestamp, Research Question, Purpose, Expected Outcome
# OPTIONAL SECTIONS: notes
# VALIDATION RULES: YAML must parse cleanly and pass
#   `python -m config_validation <path>` (run from 17_Automation/).
#   The template itself passes with `--template` (placeholders allowed).
# NAMING CONVENTION: config.yaml
# FOLDER LOCATION: 06_Experiments/EXPxxxx
# DEFINITION OF DONE: Config validated before training, saved, and never edited
#   post-training.
# COMMON MISTAKES: Hardcoding parameters in notebooks instead of config;
#   leaving git_commit / timestamp empty; changing a fairness invariant without
#   changing study_track.
# RELATED TEMPLATES: Template 7
# REFERENCES: 05_Models/FASTAI_TRAINING_STANDARD.md, 05_Models/baseline_plan.md,
#   05_Models/config/fastai_dataset.yaml
# ==============================================================================
# Defaults below are the primary architecture track (EXP0001 baseline).
# Fill every `EXPxxxx` placeholder and the runtime fields before training.

schema_version: 1

# --- Experiment ID ------------------------------------------------------------
experiment_id: EXPxxxx

# --- Research Question / Purpose / Expected Outcome ---------------------------
research_question: >-
  How can we improve the cross-generator generalization of image-based AI face
  detection models to maintain high accuracy on unseen generative architectures?
purpose: >-
  Describe what this experiment tests and which single variable changes
  relative to its comparator.
expected_outcome: >-
  State the expected result and the metric threshold that would confirm or
  reject it.
# primary_architecture | generator_holdout | quick_convenience | external_eval | ablation
study_track: primary_architecture

# --- Dataset Version ----------------------------------------------------------
dataset:
  dataset_id: DS0001
  version: v1.0
  pipeline_id: PP0001
  output_id: DS0001_PP0001
  processed_kaggle_slug: isthisdeception/ds0001-pp0001
  processed_root: /kaggle/input/datasets/isthisdeception/ds0001-pp0001/DS0001_PP0001
  path_column: processed_path
  label_column: class_label
  partition_column: partition
  vocab: [fake, real]

# --- Split Version ------------------------------------------------------------
split:
  split_id: SPLIT0001
  scheme: grouped_random
  assignments_csv: 03_Datasets/splits/DS0001_PP0001_SPLIT0001/assignments.csv
  train_name: train
  valid_name: val
  test_name: test
  leakage_required: PASS

# --- Model Version ------------------------------------------------------------
model:
  model_id: MODEL0001
  architecture: ResNet-50
  backbone: resnet50          # name passed to vision_learner
  source: torchvision         # torchvision | timm
  pretrained: true
  pretrained_weights: ImageNet-1k

# --- FastAI Settings ----------------------------------------------------------
fastai:
  datablock:
    blocks: [ImageBlock, CategoryBlock]
    get_items: assignments_csv
    get_x: processed_root + processed_path
    get_y: class_label
    splitter: column_splitter
    n_inp: 1
  item_tfms:
    resize: 224               # must equal image_size
    method: squish
  normalize:
    stats: imagenet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  dataloaders:
    batch_size_eval: 128
    num_workers: 2
    drop_last: false
    shuffle_train: true
  mixed_precision: true       # learn.to_fp16()
  lr_finder:
    enabled: true
    suggest_func: valley
    num_it: 100
  schedule:
    method: fine_tune         # fine_tune | fit_one_cycle
    freeze_epochs: 1          # frozen-head epochs before unfreeze (transfer learning)
    lr_mult: 100              # body LR = head LR / lr_mult after unfreeze
    pct_start: 0.3            # one-cycle warm-up fraction (unfrozen phase)
    div: 5.0                  # one-cycle initial LR divisor (unfrozen phase)
  callbacks:
    save_model:
      monitor: valid_loss
      comp: min
      every_epoch: true
      with_opt: true
    early_stopping:
      enabled: true
      monitor: valid_loss
      patience: 3
    csv_logger: true
  export:
    export_pkl: true
    weights_pth: true

# --- Image Size / Batch Size / Epochs -----------------------------------------
image_size: 224
batch_size: 64
epochs: 10                    # unfrozen epochs after freeze_epochs

# --- Optimizer / Learning Rate / Loss Function --------------------------------
optimizer:
  name: Adam                  # FastAI Adam with decoupled weight decay
  weight_decay: 0.01
  betas: [0.9, 0.99]
learning_rate:
  value: 1.0e-3               # record the LR Finder suggestion here before training
  source: lr_find             # manual | lr_find
loss_function:
  name: CrossEntropyLossFlat
  label_smoothing: 0.0

# --- Metrics ------------------------------------------------------------------
# Canonical set from 05_Models/baseline_plan.md; every compared run reports all.
metrics:
  primary: [roc_auc, pr_auc, f1, balanced_accuracy, mcc, precision, recall, specificity, fpr, fnr]
  secondary: [accuracy, ece, brier]
  monitor: valid_loss
  positive_class: fake        # class treated as positive (detection target)
  threshold_policy: validation_only
  threshold_criterion: max_balanced_accuracy
  calibration_bins: 15        # equal-width bins for ECE

# --- Random Seed --------------------------------------------------------------
random_seed: 42

# --- Augmentations ------------------------------------------------------------
augmentations:
  aug_transforms:
    enabled: true
    train_only: true
    do_flip: true
    flip_vert: false
    max_rotate: 10.0
    max_zoom: 1.05
    max_lighting: 0.1
    max_warp: 0.0
    min_scale: 1.0
    pad_mode: zeros

# --- Hardware -----------------------------------------------------------------
hardware:
  platform: kaggle
  accelerator: GPU
  gpu: T4                     # not P100: cu128 dropped sm_60
  kaggle_image: v170
  environment_lock: environment/versions.lock.md

# --- Output folders / checkpoint location -------------------------------------
outputs:
  experiment_dir: 06_Experiments/EXPxxxx
  checkpoint_dir: 06_Experiments/EXPxxxx/notebook/checkpoints
  checkpoint_manifest: 07_Checkpoints/EXPxxxx_checkpoints.md
  artifact_dataset_slug: isthisdeception/thesis-experiment-artifacts

# --- Git Commit / Timestamp (fill at session start, before training) ----------
git_commit: null              # full or short SHA of the repo state used
timestamp: null               # ISO-8601 with timezone, e.g. 2026-11-07T10:00:00+06:00

notes: ""
