# EXP0002 training session (generator holdout). Runbook: 06_Experiments/EXP0002/KAGGLE_RUNBOOK.md
repo_url: https://github.com/isthisdeception/thesis.git
repo_branch: main
repo_dir: thesis
workspace_root: /kaggle/working
kaggle_requirements: environment/kaggle-requirements.txt

metadata_paths:
  - 07_Checkpoints/EXP0002_checkpoints.md
  - 06_Experiments/EXP0002/logs
  - 06_Experiments/EXP0002/metrics
  - 06_Experiments/EXP0002/learning_curves
  - 06_Experiments/EXP0002/predictions
  - 06_Experiments/EXP0002/notebook/checkpoints/checkpoint_manifest.json

dataset_mounts:
  - name: ds0001_processed
    slug: isthisdeception/ds0001-pp0001
    mount_path: /kaggle/input/datasets/isthisdeception/ds0001-pp0001
    tier: data
    required: true

checkpoint_sources:
  - name: exp0002_resume
    input_path: /kaggle/input/datasets/isthisdeception/thesis-exp0002-artifacts/notebook/checkpoints
    target_relpath: 06_Experiments/EXP0002/notebook/checkpoints
    required: false

# A separate dataset: publishing EXP0002 to thesis-experiment-artifacts would replace MODEL0001's files.
publish_targets:
  - dataset_slug: isthisdeception/thesis-exp0002-artifacts
    title: Thesis EXP0002 Artifacts
    upload_dir: 06_Experiments/EXP0002
    version_notes: EXP0002 checkpoints and MODEL0008 export from Kaggle
    is_private: true
    convert_to_csv: false
