# Conda environment matching the Kaggle GPU image observed 2026-11-08
# (Python 3.13 + PyTorch 2.11 / CUDA 13.0). Source of truth for package versions is
# requirements.txt + versions.lock.md.
name: thesis
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - -r requirements.txt
